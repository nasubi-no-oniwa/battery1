.tabs{display:flex;gap:6px;margin-top:10px}.tabs button{flex:1;padding:8px;border:none;border-radius:10px;background:#2a2d34;color:#c9ccd2;font-weight:800;font-family:inherit;font-size:14px}.tabs button.on{background:#fff;color:#000}
